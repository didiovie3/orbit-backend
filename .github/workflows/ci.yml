name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Dummy values — enough for Settings/check_required_settings() to pass
    # so the app actually imports. Never real secrets; this is CI only.
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
      SUPABASE_JWT_SECRET: ci-placeholder-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Import check
        # Catches the exact class of bug we hit locally — a missing/broken
        # .env value failing loudly at import time rather than three
        # layers deep the first time a route gets hit.
        run: python -c "from app.main import app; print('App imports OK')"

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests/ directory yet — skipping. Add one before this step should start enforcing anything."
          fi
